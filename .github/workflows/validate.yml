name: Validate Meu Financeiro
on:
  push:
    paths:
      - "review-v9.html"
      - "review-v10.html"
      - "review-v11.html"
      - "scripts/smoke.js"
      - "scripts/ux-smoke.js"
      - "scripts/accounting-smoke.js"
      - "scripts/daily-cash-smoke.js"
      - "scripts/planning-smoke.js"
      - "scripts/review-smoke.js"
      - "index.html"
      - ".github/workflows/validate.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JS syntax and privacy
        run: |
          python3 - <<'PY'
          import pathlib,json,re,subprocess
          for file in ('review-v9.html','review-v10.html','review-v11.html','index.html'):
              page=pathlib.Path(file).read_text()
              m=re.search(r'<script[^>]*>(.*?)</script>',page,re.S)
              assert m, 'No inline JS in '+file
              pathlib.Path('/tmp/app.js').write_text(m.group(1))
              subprocess.run(['node','--check','/tmp/app.js'],check=True)
              seed=re.search(r'const SEED=(\{.*?\});\s*\(\(\)=>',page,re.S)
              assert seed,'No seed found'
              obj=json.loads(seed.group(1))
              assert obj['openingCents']==0 and obj['salaryNetCents']==0
              for k in ('entries','invoices','movements','receivables','ledger','inbox','nubankLoans'):assert not obj[k], f'Private data in {k}'
              print(file,'syntax and privacy OK')
          PY
      - name: Run synthetic simulation tests
        run: |
          node scripts/smoke.js index.html
          node scripts/ux-smoke.js index.html
          node scripts/accounting-smoke.js index.html
          node scripts/daily-cash-smoke.js index.html
          node scripts/planning-smoke.js index.html
          node scripts/review-smoke.js index.html
          node scripts/smoke.js review-v10.html
          node scripts/smoke.js review-v11.html
      - name: Package source for independent review
        run: zip -j Meu_Financeiro_V16_Para_Claude.zip index.html README.md
      - name: Upload downloadable app
        uses: actions/upload-artifact@v4
        with:
          name: Meu-Financeiro-V16-para-Claude
          path: Meu_Financeiro_V16_Para_Claude.zip
          retention-days: 30

