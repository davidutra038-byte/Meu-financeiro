function expenseRows(){

 if(ui.expenseCard==='none'&&e.card||ui.expenseCard!=='all'&&ui.expenseCard!=='none'&&e.card!==ui.expenseCard)return false;
 if(ui.expenseMethod==='cartao'&&!e.card||ui.expenseMethod==='conta'&&e.card||ui.expenseMethod==='parcelado'&&!e.installment||ui.expenseMethod==='avista'&&e.installment)return false;
 return true});
 const date=e=>String(e.dateInfo.date||'0000-00-00');
 const actual=e=>!!e.dateInfo.date&&e.dateInfo.date<=nowDate()&&(e.rowType==='movement'||['pago','recebido'].includes(e.status));

 });

}
