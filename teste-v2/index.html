function installmentEndingGroups(){
 const groups=new Map(),current=cycleKey();
 for(const r of spendingRecords()){
  if(r.ref<current)continue;const part=parseInstallment(r);if(!part||part.total<=1||r.source?.status==='nao_realizado')continue;
  const end=shift(r.ref,part.total-part.number);
  const raw=String(r.description||'').replace(/\s*·\s*parcela\s*\d+\s*\/\s*\d+.*$/i,'').replace(/\bparcela\s*(?:prevista\s*)?\d+\s*\/\s*\d+/i,'').replace(/\s*·\s*\d+\s*\/\s*\d+/,'').replace(/\s*\(mínimo identificado\)$/i,'').trim();
  const name=raw||r.merchant||'Parcelamento';
  const explicit=r.source?.series||r.source?.installmentGroupId||r.source?.loanId||'';
  const key=explicit?'explicit:'+explicit+'|'+end:'estimated:'+r.card+'|'+name.toLowerCase()+'|'+r.cents+'|'+part.total+'|'+end;
  if(!groups.has(key))groups.set(key,{key,name,card:r.card||'',end,total:part.total,rows:[],ambiguous:!explicit});
  groups.get(key).rows.push({...r,part});
 }
 const sequences=[...groups.values()].map(g=>{
  const start=Math.min(...g.rows.map(r=>r.part.number));
  const expected=g.total-start+1;const seen=new Map();
  for(const r of g.rows){if(!seen.has(r.part.number))seen.set(r.part.number,[]);seen.get(r.part.number).push(r)}
  const complete=seen.size===expected&&Array.from({length:expected},(_,i)=>start+i).every(num=>{
   const rows=seen.get(num)||[];
   return rows.length===1&&shift(rows[0].ref,g.total-num)===g.end;
  });
  const last=seen.get(g.total)||[],endAmount=last.length===1?last[0].cents:0;
  return {...g,firstNumber:start,remaining:expected,known:g.rows.reduce((n,r)=>n+r.cents,0),complete,release:complete?endAmount:0,lastAmount:endAmount};
 }).sort((a,b)=>a.end.localeCompare(b.end)||a.name.localeCompare(b.name,'pt-BR'));
 const endGroups=new Map();
 for(const g of sequences){if(!endGroups.has(g.end))endGroups.set(g.end,{cycle:g.end,items:[],release:0,known:0,confirmed:0,partial:0,lastAmounts:0});const x=endGroups.get(g.end);x.items.push(g);x.known+=g.known;x.release+=g.release;x.lastAmounts+=g.lastAmount;x.confirmed+=g.complete?1:0;x.partial+=g.complete?0:1;}
 return [...endGroups.values()].sort((a,b)=>a.cycle.localeCompare(b.cycle));
}

function applyBillPayment(r,amount,date,already){

 if(r.kind==='entry'){
  const e=data.entries.find(x=>x.id===r.id);if(!e||isPastPaid(e)||e.card)throw Error('A despesa já foi paga ou não permite pagamento direto.');
  if(safeN(e.cents)!==amount&&e.plannedCents===undefined)e.plannedCents=safeN(e.cents);
  e.cents=amount;e.paidAt=date;e.status='pago';e.alreadyInBalance=already;e.includeInProjection=true;
  if(isConstructionEntry(e))e.constructionFixed=true;
  entryCashSync(e,already);
 }else if(r.kind==='invoice'){
  const i=data.invoices.find(x=>x.id===r.id);if(!i||i.paid||i.deleted)throw Error('A fatura já foi paga ou não existe.');
  i.paid=true;i.paidAt=date;i.estimated=false;
  i.confirmedPaidAmountCents=amount;i.manualDeltaCents=amount-safeN(i.amountCents);
  const lid=`vnext-invoice-${i.id}`;
  data.ledger=data.ledger.filter(l=>l.id!==lid);
  data.ledger.push({id:lid,date,cents:-amount,affectsCash:!already,description:'Pagamento da fatura '+i.card,category:'Faturas de cartão',relatedInvoiceId:i.id,vnext:true});
 }else throw Error('Tipo de pagamento não suportado.');
}
