/* Análise de cartões V7: uma única área de exploração */
.insight-toolbar{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.insight-toolbar>div:first-child{flex:1;min-width:185px}.insight-toolbar select{max-width:360px;margin-top:5px;width:100%}
.insight-period{display:flex;gap:4px;flex-direction:column;text-align:right}.insight-period strong{font-size:12px}
.insight-tabs{display:flex;gap:7px;overflow-x:auto;scrollbar-width:thin;padding:4px 0 10px;white-space:nowrap}
.insight-tabs button{background:#f4f7fb;border:1px solid #dce5ef;color:#355371;border-radius:999px;padding:10px 13px;font-size:12px;font-weight:750;cursor:pointer;flex-shrink:0}
.insight-tabs button.on{background:var(--navy);color:white;border-color:var(--navy)}
.insight-summary{display:flex;align-items:center;justify-content:space-between;padding:14px;background:#eff5fb;border-radius:12px;margin:2px 0 15px;gap:10px;font-size:12px}
.insight-summary b{font-size:17px;white-space:nowrap}
.insight-group-caption{display:block;font-size:10px;color:var(--sub);font-weight:450;margin-top:3px}
.insight-inner{padding:0 4px 4px}.insight-action-row{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.insight-description{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1;overflow-wrap:anywhere}
.insight-description strong{color:var(--ink);font-weight:650}.insight-description small{display:block}
.insight-side{display:flex;gap:8px;align-items:center;flex-shrink:0}
.btn-classify{font-size:11px;padding:6px 8px;white-space:nowrap;line-height:1}
.btn-classify svg{width:13px;height:13px}
.insight-rank{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.insight-rank .insight-row{flex:1;border:0}.rank-n{padding-left:8px;font-size:11px;font-weight:800;color:var(--sub);min-width:25px}
@media(max-width:650px){.insight-side{align-items:flex-end;flex-direction:column;gap:5px}.btn-classify{padding:7px 9px}.item-actions{flex-wrap:wrap;justify-content:flex-end}.item-actions>.amount{width:100%;text-align:right}.insight-summary{align-items:flex-start;flex-wrap:wrap}.insight-toolbar select{max-width:100%}}

/* iPhone-first accessibility and cash-scenario interface */

.sim-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:20px}

.sim-eyebrow{font-size:11px;color:var(--brand);font-weight:750;letter-spacing:.3px}
.sim-pill{border-radius:99px;background:#e7f5ed;color:#196046;font-weight:800;padding:8px 12px;font-size:11px;white-space:nowrap}

 }).join('')}</tbody></table></div>
 <p class="caption">O pior saldo considera encerramentos de ciclos, não faltas de dinheiro dentro do mês. Confirme o CET e a data de liberação no FUNCEF.</p></div>`;

ldo e salário ainda não mudaram.</p>`:''}</div><div class="card pad"><div class="section-heading"><h2>Controle de dívidas</h2></div><div class="details"><div class="detail-row"><span>Losango · quitação oferecida 23/11</span><span>${m(s.losango.payoffCents)}</span></div><div class="detail-row"><span>Empréstimos Nubank · quitação atual</span><span>${m(sumBy(s.nubankLoans.filter(x=>!x.paid),x=>x.payoffCents))}</span></div><div class="detail-row"><span>Nubank · prestação mensal somada</span><span>${m(sumBy(s.nubankLoans.filter(x=>!x.paid),x=>x.monthlyCents))}</span></div></div><div class="row" style="margin-top:15px;gap:8px;flex-wrap:wrap"><button class="btn btn-sm ${s.losango.paid?'':'btn-primary'}" data-act="askPayLosango" ${s.losango.paid?'disabled':''}>${s.losango.paid?'Losango quitada':'Registrar quitação Losango'}</button>${s.nubankLoans.filter(x=>!x.paid).map(x=>`<button class="btn btn-sm" data-act="askPayNubank" data-id="${x.id}">Quitar ${m(x.monthlyCents)}/mês</button>`).join('')}</div></div></div></details>

function notificationLines(text){return text.split(/\r?\n/).map(x=>x.trim()).filter(x=>x.length>10).slice(0,250).map(x=>{
 let parts=x.split('|'),date=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10),app='',body=x;
 if(parts.length>=3&&/^\d{4}-\d\d-\d\d$/.test(parts[0].trim())){date=parts.shift().trim();app=parts.shift().trim();body=parts.join('|').trim()}else if(parts.length>=2&&/^(Nubank|C6(?: Black)?|Sicoob|Mercado Pago|BRB|Renner|C&A(?: Pay)?)$/i.test(parts[0].trim())){app=parts.shift().trim();body=parts.join('|').trim()}
 const dm=body.match(/(?:R\$\s*)([\d.,]+\d{2})/i),amount=dm?cents(dm[1]):0;
 const bank=app||(['Nubank','C6','Sicoob','Mercado Pago','Renner','C&A'].find(v=>body.toLowerCase().includes(v.toLowerCase()))||'Não identificado');
 const normalized=[date,bank,body].join('|').replace(/\s+/g,' ').toLowerCase();
 return {id:'notif-'+V(),date,app:bank,body,amount,normalized,status:'pending'};
});}

function field(name,id,value='',type='text',extra=''){return `<div><label for="${id}">${h(name)}</label><input id="${id}" name="${id}" type="${type}" value="${h(value)}" ${extra}></div>`}
function selectField(name,id,options,selected){return `<div><label for="${id}">${h(name)}</label><select id="${id}" name="${id}">${options.map(([v,label])=>`<option value="${h(v)}" ${v===selected?'selected':''}>${h(label)}</option>`).join('')}</select></div>`}

function payInvoice(id){const inv=s.invoices.find(x=>x.id===id);if(!inv||inv.paid)return;ask('Confirmar pagamento da fatura',`Registrar que você PAGOU ${m(currentInvoice(inv))} de ${inv.card} agora? O aplicativo descontará essa quantia do caixa, e a cobrança deixará de aparecer na projeção.`,()=>{snapshot();inv.paid=true;s.ledger.push({id:'pay-'+id,date:localToday(),ref:'invoice-'+id,cents:-currentInvoice(inv),category:'Pagamento de fatura',description:'Pagamento '+inv.card});commit('Pagamento registrado.');toast('Fatura paga registrada.',true)})}
function reopenInvoice(id){const inv=s.invoices.find(x=>x.id===id);if(!inv||!inv.paid)return;ask('Reabrir fatura',`Voltar a fatura ${inv.card} ao status pendente? O pagamento que foi registrado pelo aplicativo também será revertido do caixa.`,()=>{snapshot();inv.paid=false;s.ledger=s.ledger.filter(e=>e.id!=='pay-'+id);commit('Fatura reaberta.');})}
function payoffLosango(){if(s.losango.paid)return;ask('Registrar quitação da Losango',`Você realmente pagou ${m(s.losango.payoffCents)} à vista? Isso reduzirá o caixa e removerá futuras parcelas da Losango da projeção.`,()=>{snapshot();s.losango.paid=true;s.ledger.push({id:'pay-losango',date:localToday(),cents:-s.losango.payoffCents,category:'Quitação de dívida',description:'Quitação Losango à vista'});commit('Losango marcada como quitada.');})}
function payoffNubank(id){const l=s.nubankLoans.find(x=>x.id===id);if(!l||l.paid)return;ask('Quitar contrato Nubank',`Você realmente quitou o contrato de ${m(l.monthlyCents)} por mês, pagando ${m(l.payoffCents)} à vista? O pagamento sairá do caixa, e as futuras parcelas desse contrato deixarão de ser projetadas.`,()=>{snapshot();l.paid=true;s.ledger.push({id:'pay-'+id,date:localToday(),cents:-l.payoffCents,category:'Quitação de dívida',description:'Quitação antecipada '+l.name});commit('Quitação Nubank registrada.');})}
function onClick(e){const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act,id=b.dataset.id||'';
 if(act==='nav'){setPage(b.dataset.page);return}
 if(act==='currentCycle'){s.referenceCycle=activeCycle();s.settings.referenceCycleManual=false;detailCycle=s.referenceCycle;save();render();return}
 if(act==='cardCyclePrev'){s.cardViewCycle=cycShift(s.cardViewCycle,-1);save();render();return}
 if(act==='cardCycleNext'){s.cardViewCycle=cycShift(s.cardViewCycle,1);save();render();return}
 if(act==='selectCard'){selectedCard=id;render();return}
 if(act==='insightTab'){insightView=id;render();return}
 if(act==='editCategory'){showModal('quickCategory',id);return}
 if(act==='activityFilter'){activityFilter=id;render();return}
 if(act==='editEntry'){const e=s.entries.find(x=>x.id===id);if(e){if(e.card){showModal('transaction',id)}else showModal('expense',id)}return}
 if(act==='deleteEntry'){deleteEntry(id);return}
if(act==='open'){showModal(b.dataset.modal,id);return}if(act==='closeModal'){closeModal();return}if(act==='card'){const iv=s.invoices.find(x=>x.id===id);if(iv){selectedCard=iv.card;s.cardViewCycle=iv.cycle}else{selectedCard=id}setPage('cards');return}if(act==='scrollToConsolidated'){document.querySelector('#consolidado')?.scrollIntoView({behavior:'smooth'});return}
 if(act==='export'){exportSecureBackup();return}if(act==='exportAnalysis'){if(!window.confirm('Esta exportação NÃO terá senha e conterá seu histórico financeiro. Gere apenas para enviar privadamente nesta conversa, nunca publique no GitHub. Continuar?'))return;exportBackup();return}
 if(act==='importDelta'){$('#importDeltaFile')?.click();return}
 if(act==='addNotifications'){const v=$('#notificationPaste')?.value||'';if(!v.trim())return alert('Cole ao menos uma notificação.');addNotificationText(v);return}
 if(act==='importNotificationsFile'){$('#notificationFile')?.click();return}
 if(act==='reviewNotification'){showModal('notification',id);return}
 if(act==='ignoreNotification'){const n=s.inbox.find(x=>x.id===id);if(n){snapshot();n.status='ignored';commit('Notificação ignorada.')}return}if(act==='import'){$('#importBackup').click();return}
 if(act==='undo'){if(lastUndo){s=lastUndo;lastUndo=null;commit('Última alteração desfeita.')}return}
 if(act==='deleteTx'){deleteTransaction(id);return}if(act==='deleteReceivable'){deleteReceivable(id);return}
 if(act==='askPayInvoice'){payInvoice(id);return}if(act==='unpayInvoice'){reopenInvoice(id);return}
 if(act==='askPayEntry'){payEntry(id);return}if(act==='askPayLosango'){payoffLosango();return}if(act==='askPayNubank'){payoffNubank(id);return}
}
function onChange(e){const el=e.target;
 if(el.dataset.field==='cardScope'){cardScope=el.value;render();return}
 if(el.dataset.field==='insightCard'){insightCard=el.value;render();return}
 if(el.dataset.field==='whatIfHorizon'){s.whatIf.horizon=Number(el.value);save();render();return}
 if(el.dataset.field==='whatIfLoan'){s.whatIf.option=el.value;save();render();return}
 if(el.dataset.field==='whatIfStart'){s.whatIf.startCycle=el.value;save();render();return}
 if(['whatIfLosango','whatIfNubankSmall','whatIfNubankLarge','whatIfCards'].includes(el.dataset.field)){
  const key={whatIfLosango:'payLosango',whatIfNubankSmall:'payNubankSmall',whatIfNubankLarge:'payNubankLarge',whatIfCards:'payCards'}[el.dataset.field];s.whatIf[key]=el.checked;save();render();return;
 }
 if(el.dataset.field==='cycle'){s.referenceCycle=el.value;s.settings.referenceCycleManual=true;detailCycle=el.value;save();render();return}
 if(el.dataset.field==='loanOption'){
  s.loan.option=el.value;save();const chosen=s.loanOptions.find(x=>x.id===el.value);if(modalName==='loan'&&chosen){$('#loanNet').value=fmt(chosen.netCents/100);$('#loanPayment').value=fmt(chosen.installmentCents/100);$('#loanMonths').value=chosen.months;}else render();return
 }
}
document.addEventListener('click',onClick);
document.addEventListener('change',onChange);
document.addEventListener('submit',e=>{if(e.target.id==='modalForm'){e.preventDefault();submitForm(e.target,e.target.dataset.submit)}});
document.addEventListener('change',async e=>{if(e.target.id==='notificationFile'){const f=e.target.files?.[0];if(f)addNotificationText(await f.text());e.target.value=''}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalName)closeModal()});
document.addEventListener('click',e=>{if(e.target.matches('[data-overlay]'))closeModal()});
document.addEventListener('change',async e=>{if(e.target.id==='importDeltaFile'){
 const f=e.target.files?.[0];if(f)importDelta(await f.text());e.target.value='';
}});
document.addEventListener('change',async e=>{if(e.target.id==='importBackup'){const f=e.target.files?.[0];if(f)await importSecureOrLegacy(await f.text())}});
function acceptShortcutLink(){
 try{
  const hash=window?.location?.hash||'';
  if(!hash.startsWith('#mov='))return;
  const msg=decodeURIComponent(hash.slice(5));
  if(window.history?.replaceState)window.history.replaceState(null,'',window.location.pathname+window.location.search);
  if(!msg||msg.length>900||!/(R\$\s*[\d.,]+\d{2})/.test(msg))return alert('Notificação recebida sem valor em reais. Confira o texto no Atalhos.');
  if(/(?:c[oó]digo de acesso|c[oó]digo de seguran[cç]a|senha|otp|token|verifica[cç][aã]o|autentica[cç][aã]o)/i.test(msg))return alert('Mensagem de segurança ignorada.');
  addNotificationText(msg.replace(/[\r\n]+/g,' ').trim());setPage('activity');
 }catch(e){alert('Não foi possível interpretar o link do Atalhos.');}
}
render();acceptShortcutLink();
window?.addEventListener?.('hashchange',acceptShortcutLink);
})();
</script></body></html>
