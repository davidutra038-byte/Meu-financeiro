/* Análise de cartões V7: uma única área de exploração */
.insight-toolbar{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.insight-toolbar>div:first-child{flex:1;min-width:185px}.insight-toolbar select{max-width:360px;margin-top:5px;width:100%}
.insight-period{display:flex;gap:4px;flex-direction:column;text-align:right}.insight-period strong{font-size:12px}
.insight-tabs{display:flex;gap:7px;overflow-x:auto;scrollbar-width:thin;padding:4px 0 10px;white-space:nowrap}
.insight-tabs button{background:#f4f7fb;border:1px solid #dce5ef;color:#355371;border-radius:999px;padding:10px 13px;font-size:12px;font-weight:750;cursor:pointer;flex-shrink:0}
.insight-tabs button.on{background:var(--navy);color:white;border-color:var(--navy)}
.insight-summary{display:flex;align-items:center;justify-content:space-between;padding:14px;background:#eff5fb;border-radius:12px;margin:2px 0 15px;gap:10px;font-size:12px}
.insight-summary b{font-size:17px;white-space:nowrap}
.insight-group-caption{display:block;font-size:12px;color:var(--sub);font-weight:450;margin-top:3px}
.insight-inner{padding:0 4px 4px}.insight-action-row{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.insight-description{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1;overflow-wrap:anywhere}
.insight-description strong{color:var(--ink);font-weight:650}.insight-description small{display:block}
.insight-side{display:flex;gap:8px;align-items:center;flex-shrink:0}
.btn-classify{font-size:12px;padding:6px 8px;white-space:nowrap;line-height:1}
.btn-classify svg{width:13px;height:13px}
.insight-rank{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.insight-rank .insight-row{flex:1;border:0}.rank-n{padding-left:8px;font-size:12px;font-weight:800;color:var(--sub);min-width:25px}
@media(max-width:650px){.insight-side{align-items:flex-end;flex-direction:column;gap:5px}.btn-classify{padding:7px 9px}.item-actions{flex-wrap:wrap;justify-content:flex-end}.item-actions>.amount{width:100%;text-align:right}.insight-summary{align-items:flex-start;flex-wrap:wrap}.insight-toolbar select{max-width:100%}}

/* iPhone-first accessibility and cash-scenario interface */

.sim-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:20px}

.sim-eyebrow{font-size:12px;color:var(--brand);font-weight:750;letter-spacing:.3px}
.sim-pill{border-radius:99px;background:#e7f5ed;color:#196046;font-weight:800;padding:8px 12px;font-size:12px;white-space:nowrap}

function scenarioProjectionCore(loanId=null){

 const carry=carryForwardCommitments(firstCycle),simulatedCarry=carryForwardCommitments(firstCycle,{losango:!!dueLosango,small:!!dueSmall,large:!!dueLarge});let balance=instant-simulatedCarry,baseline=currentCash-carry,rows=[];

 const push=(row,date)=>{const originalDate=validDate(date)?date:'';const reserve=cycleStart(row.cycle||activeCycle());const when=originalDate||reserve;const actual=when<today?today:when;if(actual>until)return;const event={...row,date:actual,originalDate,assumed:!originalDate,overdue:!!originalDate&&originalDate<today};events.push(event);if(!originalDate)undated.push(event)};

  push({id:e.id,kind:'entry',name:e.description,cycle:e.month,cents:-amount},e.dueDate);
 }

 for(const i of s.invoices.filter(x=>!x.paid))push({id:i.id,kind:'invoice',name:'Fatura '+i.card,cycle:i.cycle,cents:-currentInvoice(i)},i.dueDate);

 }
 for(const e of s.entries.filter(x=>x.type==='receita'&&x.status==='previsto'&&x.id?.startsWith('manual-')&&x.includeInProjection!==false&&validDate(x.dueDate)&&x.dueDate>=today))push({id:e.id,kind:'income',name:e.description,cycle:e.month,cents:e.cents},e.dueDate);
 events.sort((a,b)=>a.date.localeCompare(b.date)||a.cents-b.cents||a.name.localeCompare(b.name,'pt-BR'));

function saveCardPurchase(form){
 const old=s.movements.find(x=>x.id===editTarget),future=s.entries.find(x=>x.id===editTarget&&x.card&&!isLoanEntry(x));
 const card=formVal(form,'card'),month=formVal(form,'billingCycle'),date=formVal(form,'date'),description=formVal(form,'description').trim(),amount=validateMoney(formVal(form,'amount')),installment=formVal(form,'installment').trim();

 if(!validDate(date)||!description||!amount)throw Error('Confira a data, descrição e valor da compra.');

 const values={id,date,description,cents:amount,financialKind:'cardPurchase',category:formVal(form,'category'),installment,budgetKey:formVal(form,'budgetKey'),sourceType:old?.sourceType||'manual',deleted:false};
 snapshot();
 if(invoice){
  if(old)Object.assign(old,values,{invoice:invoice.id,cycle:month});else{s.movements.unshift({...values,invoice:invoice.id,cycle:month});if(future)s.entries=s.entries.filter(e=>e!==future)}
 }else{
  const entry={...values,month,type:'despesa',card,dueDate:date,status:'previsto',includeInProjection:true,source:'Compra de cartão informada manualmente'};

}

document.addEventListener('toggle',e=>{if(e.target.id==='debtSimulator')simulatorOpen=e.target.open},true);
document.addEventListener('click',onClick);

document.addEventListener('input',e=>{if(e.target.id==='cardPurchaseSearch'){const term=e.target.value.toLocaleLowerCase('pt-BR').trim();document.querySelectorAll('#cardPurchaseList [data-record-search]').forEach(row=>{row.hidden=!row.dataset.recordSearch.includes(term)});return}
 if(modalName==='customProposal'){refreshProposalTotal();return}if(modalName==='seriesEdit'){refreshRecurrencePreview();return}if(e.target.id==='activitySearch'){activitySearch=e.target.value;activitySearchRows();return}if(e.target.closest?.('[data-launch-form]'))updateLaunchForm(e.target.name);if(e.target.closest?.('#modalForm')&&!e.target.closest?.('[data-launch-form]'))updateCashPreview()});
document.addEventListener('submit',e=>{if(e.target.id==='modalForm'){e.preventDefault();submitForm(e.target,e.target.dataset.submit)}});
document.addEventListener('change',async e=>{if(e.target.id==='notificationFile'){const f=e.target.files?.[0];if(f)addNotificationText(await f.text());e.target.value=''}});
document.addEventListener('keydown',e=>{if(!modalName)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const els=[...document.querySelectorAll('.modal button,.modal input,.modal select,.modal textarea')].filter(x=>!x.disabled&&x.type!=='hidden'&&x.getClientRects().length);const first=els[0],last=els.at(-1);if(e.shiftKey&&(document.activeElement===first||document.activeElement?.getAttribute('role')==='dialog')){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
document.addEventListener('click',e=>{if(e.target.matches('[data-overlay]'))closeModal()});
document.addEventListener('change',async e=>{if(e.target.id==='importDeltaFile'){
 const f=e.target.files?.[0];if(f)importDelta(await f.text());e.target.value='';
}});

function acceptShortcutLink(){
 try{
  const hash=window?.location?.hash||'';
  if(!hash.startsWith('#mov='))return;
  const msg=decodeURIComponent(hash.slice(5));
  if(window.history?.replaceState)window.history.replaceState(null,'',window.location.pathname+window.location.search);
  if(!msg||msg.length>900||!/(R\$\s*[\d.,]+\d{2})/.test(msg))return notifyError('Notificação recebida sem valor em reais. Confira o texto no Atalhos.');
  if(/(?:c[oó]digo de acesso|c[oó]digo de seguran[cç]a|senha|otp|token|verifica[cç][aã]o|autentica[cç][aã]o)/i.test(msg))return notifyError('Mensagem de segurança ignorada.');
  addNotificationText(msg.replace(/[\r\n]+/g,' ').trim());setPage('activity');
 }catch(e){notifyError('Não foi possível interpretar o link do Atalhos.');}
}
render();acceptShortcutLink();
window?.addEventListener?.('hashchange',acceptShortcutLink);
})();
